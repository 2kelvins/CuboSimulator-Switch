
name: Laura Adventure - Nintendo Switch

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar Laura Adventure
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar ambiente
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "PORTLIBS=$PORTLIBS"
          ls -l /opt/devkitpro/portlibs/switch/lib/libSDL2.a
          ls -l /opt/devkitpro/portlibs/switch/lib/libEGL.a

      - name: Limpar compilacoes anteriores
        run: make clean

      - name: Compilar Laura Adventure
        run: make -j2

      - name: Verificar arquivo gerado
        run: |
          echo "Arquivos gerados:"
          ls -lh
          test -s LauraAdventure.nro
          echo "LauraAdventure.nro encontrado!"

      - name: Disponibilizar Laura Adventure
        uses: actions/upload-artifact@v4
        with:
          name: LauraAdventure-Switch
          path: LauraAdventure.nro
          if-no-files-found: error
          compression-level: 0
